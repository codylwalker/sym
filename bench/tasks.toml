# Fixed questions for the sym benchmark. Each names a LARGE file and asks about
# one or two symbols in it, so a whole-file Read is the tempting move and the
# skeleton-first read is the better one. The number the page shows is SESSION
# COST with cache reads billed, not a token-reduction figure.

[repo]
url = "https://github.com/BurntSushi/ripgrep"
ref = "14.1.1"

[[task]]
id = "defs-glob"
prompt = "In crates/core/flags/defs.rs (7,675 lines), read `impl Flag for Glob`: what does its update method do with the flag's value, and which field of LowArgs does it push into? Quote the relevant lines."

[[task]]
id = "defs-sort"
prompt = "In crates/core/flags/defs.rs, read `impl Flag for Sort`: list every accepted value of --sort and what each one maps to in the update method."

[[task]]
id = "glue-fill"
prompt = "In crates/searcher/src/searcher/glue.rs, explain what `ReadByLine::fill` does when the buffer is exhausted and how it signals end of input to `run`. Cite line numbers."

[[task]]
id = "walk-skip"
prompt = "In crates/ignore/src/walk.rs, what does `skip_entry` check, in order, before a directory entry is yielded? Cite the lines."

[[task]]
id = "json-begin"
prompt = "In crates/printer/src/json.rs, what fields does the message emitted by `begin` carry, and what does `finish` emit? Cite the functions and their lines."

[[task]]
id = "defs-colors"
prompt = "In crates/core/flags/defs.rs, read `impl Flag for Colors`: what is the documented format of a --colors spec, and how does update turn the string into a ColorSpecs entry?"

[[task]]
id = "standard-sep"
prompt = "In crates/printer/src/standard.rs (3,842 lines), how is the context separator written between non-contiguous matches? Name the method that writes it and the condition that triggers it, with line numbers."

[[task]]
id = "gitignore-matched"
prompt = "In crates/ignore/src/gitignore.rs, how does `Gitignore::matched` decide between Ignore, Whitelist and None, and what does `matched_path_or_any_parents` add on top? Cite lines."

# ── orientation tasks: no keyword to grep for; the map is the natural first move ──

[[task]]
id = "orient-walker"
prompt = "You have never seen this repository. Which crate implements the parallel directory walker, which file holds its builder, and what are the builder's public entry points (names only)? Answer from the code's structure, not from docs."

[[task]]
id = "orient-flag-arch"
prompt = "Explain how command-line flags are organized across this repository: which files define them, which file converts low-level parsed args into the high-level config, and how a new flag would be added (three files, named). Do not guess from README; find it in the code."

[[task]]
id = "orient-printer"
prompt = "List the printer formats this repository supports and name the file and the top-level type that implements each. Then say which shared module the formats depend on."

[[task]]
id = "orient-tests"
prompt = "How are integration tests structured in this repository? Name the test helper module, its main type, and three of the test files that use it. Keep the answer to structure, not content."

# The "find" family (added 2026-10-09): the question names a symbol but NOT its
# file, so the move is one definition lookup (sym find / sym read) and the
# whole-file Read is not even available as a shortcut.

[[task]]
id = "find-colorspec"
family = "find"
prompt = "Where is `UserColorSpec` defined in this repository, and what does its FromStr implementation parse a string into? Name the file and quote the signature of from_str."

[[task]]
id = "find-visit"
family = "find"
prompt = "Find the definition of `WalkParallel::visit` in this repository: which file, what does it take, and what does it return? Quote the signature."

[[task]]
id = "find-binary"
family = "find"
prompt = "Where is the `BinaryDetection` type defined in this repository, and what are its variants or constructors? Name the file and line range."

[[task]]
id = "find-search-path"
family = "find"
prompt = "Find where `Searcher::search_path` is defined: which file, what it takes, what it returns, and which other Searcher method it delegates to. Quote the relevant lines."
